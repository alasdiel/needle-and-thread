# Builds the Linux and Windows packages and attaches them to a GitHub Release.
#
# To release, from the Actions tab: Release › Run workflow, pick the branch (main), tick
# "Make a release" and run it. The release is named after the version in
# crates/desktop/src-tauri/tauri.conf.json and Cargo.toml (workspace.package), which have to
# agree; it's refused if that version has been released before, so bump both first. It's left
# as a DRAFT to read the notes and try the packages before anyone can download them (publish it
# from the Releases page), unless "Publish it straight away" is ticked too. The tag is made
# when the release is published.
#
# Run it without ticking anything to build the packages without releasing; they come back as
# workflow artifacts. Pushing a v* tag (git tag v0.1.0 && git push origin v0.1.0) releases too.
#
# The Windows installers aren't signed, so Windows warns about them on first run (SmartScreen).
# See docs/DESIGN.md §13.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Make a release, named after the version in tauri.conf.json"
        type: boolean
        default: false
      publish:
        description: "Publish it straight away, instead of leaving a draft to check first"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Lets linuxdeploy's AppImage tooling run without FUSE, which CI runners don't have.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  # What the release is called, checked before anything is built: empty when only building.
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      # The release has to agree with the version in the manifests, or the packages come out
      # labelled with a version nobody asked for.
      - name: Check the version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          conf=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' crates/desktop/src-tauri/tauri.conf.json | head -1)
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tauri.conf.json $conf · Cargo.toml $crate"
          if [ "$RELEASE" != "true" ]; then
            echo "Only building, not releasing."
            exit 0
          fi
          if [ "$conf" != "$crate" ]; then
            echo "::error::tauri.conf.json ($conf) and Cargo.toml ($crate) give different versions."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v$conf" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in the manifests ($conf)."
              exit 1
            fi
          else
            if gh release view "v$conf" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$conf" > /dev/null; then
              echo "::error::v$conf has been released already. Bump the version in tauri.conf.json and Cargo.toml first."
              exit 1
            fi
          fi
          echo "tag=v$conf" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Built on 24.04 so the packages run on anything with that glibc or newer. Tauri uses the
      # system WebKitGTK at runtime rather than bundling it, so this is a build dependency only.
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # wasm32 by name: trunk builds the Leptos frontend for it, and rustup won't add a target
      # from rust-toolchain.toml to a stable toolchain the runner already had.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-release

      # trunk builds the Leptos frontend; its pre_build hook runs the editor's esbuild bundle,
      # so pnpm has to be here before cargo tauri build.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      - name: Install the editor's packages
        run: pnpm install --frozen-lockfile
        working-directory: editor

      # Prebuilt binaries: compiling these from source costs more than the app does.
      - uses: cargo-bins/cargo-binstall@main

      - name: Install trunk and the Tauri CLI
        run: cargo binstall --no-confirm trunk tauri-cli

      - name: Build
        run: cargo tauri build --bundles deb,appimage
        working-directory: crates/desktop

      - name: Collect the packages
        id: collect
        run: |
          target=$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          mkdir -p packages
          cp "$target"/release/bundle/deb/*.deb packages/
          cp "$target"/release/bundle/appimage/*.AppImage packages/
          cp "$target"/release/needle-desktop packages/needle-and-thread-linux-x86_64
          ls -lh packages/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/*
          if-no-files-found: error

  windows:
    name: Windows installers
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # WebView2 comes with Windows 10 and 11, and the installers fetch it where it's missing,
      # so unlike WebKitGTK there's nothing to install for it here.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-release

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      - name: Install the editor's packages
        run: pnpm install --frozen-lockfile
        working-directory: editor

      - uses: cargo-bins/cargo-binstall@main

      - name: Install trunk and the Tauri CLI
        run: cargo binstall --no-confirm trunk tauri-cli

      # The Tauri CLI downloads WiX (for the .msi) and NSIS (for the setup .exe) itself.
      - name: Build
        run: cargo tauri build --bundles msi,nsis
        working-directory: crates/desktop

      # Git for Windows' bash, so the steps read the same as the Linux job's.
      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p packages
          cp target/release/bundle/msi/*.msi packages/
          cp target/release/bundle/nsis/*.exe packages/
          ls -lh packages/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: packages/*
          if-no-files-found: error

  # A draft unless asked otherwise, so nothing is public until you say so.
  release:
    name: Make the release
    if: needs.version.outputs.tag != ''
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # --target puts a new tag on the commit that was built, once the release is published.
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          draft=--draft
          if [ "$PUBLISH" = "true" ]; then draft=; fi
          gh release create "$TAG" packages/* \
            $draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
