# Deploys the sharing Worker (crates/worker) to Cloudflare. Needs the repository secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts, Workers KV Storage, D1: Edit; Account Settings: Read)
# and CLOUDFLARE_ACCOUNT_ID. The first deploy makes its KV namespace and D1 database.
name: Sharing Worker

on:
  push:
    # feat/share: temporary, to find the Worker's address before merging. Remove before merging.
    branches: [main, feat/share]
    paths:
      - "crates/worker/**"
      - "crates/core/src/share.rs"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/worker
          key: worker

      # --locked: one of its dependencies' newer versions were yanked.
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.7 --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm exec wrangler deploy

      - name: Bring the database's tables up to date
        run: pnpm exec wrangler d1 migrations apply DB --remote
