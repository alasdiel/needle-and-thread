[package]
name = "needle-vcs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Backups push over SSH with the user's own keys (libssh2, built in); HTTPS takes a token.
git2 = { version = "0.21", default-features = false, features = ["https", "ssh"] }
needle-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
