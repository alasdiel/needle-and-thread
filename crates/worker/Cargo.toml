[package]
name = "needle-worker"
version = "0.1.0"
edition = "2024"
publish = false

# The sharing Worker (DESIGN §10), on Cloudflare. Its own workspace: workers-rs pins its own
# wasm-bindgen, which mustn't hold back the apps'. Built and run with wrangler (wrangler.toml).

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
needle-core = { path = "../core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
