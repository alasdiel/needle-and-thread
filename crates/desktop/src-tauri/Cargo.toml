[package]
name = "needle-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
needle-core = { workspace = true }
needle-index = { workspace = true }
needle-vault = { workspace = true, features = ["fs"] }
needle-vcs = { workspace = true }
# Random for share links and sealing (DESIGN §10).
getrandom = "0.3"
# Talking to the sharing Worker, from the share thread.
ureq = { version = "3", features = ["json"] }
serde_json = "1"
serde = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
