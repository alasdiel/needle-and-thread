[build]
target = "index.html"
dist = "dist"

[watch]
watch = ["src", "styles", "assets", "index.html", "../../editor/src"]

[serve]
port = 1420
open = false

# Node itself rather than `pnpm run build`: trunk starts the hook as a program, and on Windows
# pnpm is a script shim that can't be started that way.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["../../editor/build.mjs"]
