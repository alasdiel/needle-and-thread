[package]
name = "needle-phone"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The phone app (DESIGN §9): a PWA that reads the vault straight from its GitHub repository.
# It only builds for wasm32, through trunk, like the desktop frontend.

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
needle-core = { workspace = true }
needle-vault = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { workspace = true }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Cache", "CacheStorage", "Document", "Element", "HtmlElement", "Request", "Response", "ResponseInit", "Event", "EventTarget", "HtmlInputElement", "Storage", "VisibilityState", "VisualViewport", "Window"] }
