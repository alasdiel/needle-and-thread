[build]
target = "index.html"
dist = "dist"
# Relative, so the same build works at a GitHub Pages path (/needle-and-thread/) and on its own.
public_url = "./"

[watch]
watch = ["src", "styles", "assets", "index.html", "../../editor/src"]

[serve]
port = 1421
open = false

# The editor island, as for the desktop: node itself rather than `pnpm run build`.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["../../editor/build.mjs"]
