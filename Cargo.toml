[workspace]
resolver = "3"
members = ["crates/core", "crates/vault", "crates/vcs", "crates/index", "crates/desktop", "crates/desktop/src-tauri", "crates/phone", "crates/reader"]
# The desktop frontend, the phone app and the reader page only build for wasm32 (via trunk), so plain
# `cargo build`/`cargo test` at the root skips them.
# The sharing Worker has its own workspace (crates/worker/Cargo.toml says why).
exclude = ["crates/worker"]
default-members = ["crates/core", "crates/vault", "crates/vcs", "crates/index", "crates/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Debug info and incremental caches made up most of a 5+ GB target/. Line tables still give
# file:line in panics for our own crates.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Parsing a full Hunspell dictionary unoptimized takes seconds in wasm debug builds.
[profile.dev.package.spellbook]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[workspace.dependencies]
needle-core = { path = "crates/core" }
# Without the "fs" feature, so the phone can build it for wasm; the desktop crates turn it on.
needle-vault = { path = "crates/vault", default-features = false }
needle-vcs = { path = "crates/vcs" }
needle-index = { path = "crates/index" }
serde = { version = "1", features = ["derive"] }
